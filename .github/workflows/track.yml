name: Aorus XP Tracker

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_data.py

      - run: python scripts/fetch_drops.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/drops.csv
          git diff --staged --quiet || git commit -m "Atualiza historico de XP e drops"
          git push
